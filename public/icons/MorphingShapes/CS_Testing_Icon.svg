<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main testing/feedback icon -->
  <g>
    <!-- Circular progress indicator -->
    <circle cx="48" cy="48" r="36" stroke="url(#gradient)" stroke-width="4" fill="none" stroke-dasharray="226" stroke-dashoffset="113"/>
    
    <!-- Checkmark for feedback -->
    <path d="M32 48 L42 58 L64 36" stroke="url(#gradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- User silhouette -->
    <circle cx="48" cy="20" r="8" fill="url(#gradient)"/>
    <path d="M32 40 C32 32 38 26 48 26 C58 26 64 32 64 40" fill="url(#gradient)"/>
  </g>
  
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>
</svg>
